# Heimdall Overview dashboard (design §3).
#
# One wall-readable dashboard, four rows in priority order: watched-service
# status · cluster CPU/memory requested-vs-used · top restarters · firing
# alerts by severity. The 28 dashboards kube-prometheus-stack bundles stay
# untouched for drill-down; this one answers "is anything wrong right now"
# from across a room.
#
# Delivered as a plain ConfigMap rather than through the Crossplane
# composition on purpose. The Grafana sidecar watches `grafana_dashboard: "1"`
# cluster-wide (METHOD=WATCH, NAMESPACE=ALL), so a labelled ConfigMap is
# picked up live with no Grafana restart and no composition revision. The
# dashboard has no dependency on any composition parameter, and embedding
# ~400 lines of JSON in a Go template would mean escaping every `{{ }}` a
# Grafana legend and a PromQL label interpolation use. ArgoCD applies this
# directory, so the file needs no additional wiring.
#
# The Prometheus datasource uid is `prometheus`, set explicitly by the
# chart's own datasource ConfigMap — it is stable across clusters, unlike the
# random `-<xrsuffix>-` release name in resource names.
#
# Node labels are shortened with label_replace so the bar charts stay legible
# at wall distance: `gke-ttf-cluster-default-pool-f1384cb5-nnwk` → `nnwk`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heimdall-overview-dashboard
  namespace: heimdall
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: heimdall
    app.kubernetes.io/component: dashboard
data:
  heimdall-overview.json: |
    {
      "uid": "heimdall-overview",
      "title": "Heimdall Overview",
      "description": "Wall-readable cluster health: watched services, requested-vs-used capacity, top restarters, firing alerts.",
      "tags": [
        "heimdall",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Watched services",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "id": 10,
          "title": "Service status",
          "description": "Up/down per watched Probe. Names come from an optional `service` label, else the Probe's name.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(label_replace(probe_success{watched=\"true\"}, \"display\", \"$1\", \"job\", \".*/([^/]+)$\"), \"display\", \"$1\", \"service\", \"(.+)\")",
              "legendFormat": "{{display}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "#d03b3b",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "#0ca30c",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  }
                ]
              },
              "noValue": "no watched probes"
            },
            "overrides": []
          }
        },
        {
          "type": "bargauge",
          "id": 11,
          "title": "TLS expiry (days)",
          "description": "Days until each watched certificate expires. Amber under 21, red under 7. Note HeimdallCertExpiringSoon covers every probe, not just these.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(label_replace((probe_ssl_earliest_cert_expiry{watched=\"true\"} - time()) / 86400, \"display\", \"$1\", \"job\", \".*/([^/]+)$\"), \"display\", \"$1\", \"service\", \"(.+)\")",
              "legendFormat": "{{display}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "min": 0,
              "max": 90,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 7
                  },
                  {
                    "color": "#0ca30c",
                    "value": 21
                  }
                ]
              },
              "noValue": "no watched TLS probes"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "Probe latency",
          "description": "Round-trip time per watched Probe. A rising line often precedes a DOWN tile.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 14,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(label_replace(probe_duration_seconds{watched=\"true\"}, \"display\", \"$1\", \"job\", \".*/([^/]+)$\"), \"display\", \"$1\", \"service\", \"(.+)\")",
              "legendFormat": "{{display}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisLabel": "seconds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3987e5",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 13,
          "title": "OpenBao",
          "description": "OpenBao seal status, inferred from StatefulSet readiness. Blank means not deployed. Not-ready can also mean unhealthy for other reasons — go look.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_statefulset_status_replicas_ready{namespace=\"openbao\", statefulset=\"openbao\"}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "SEALED",
                      "color": "#d03b3b",
                      "index": 0
                    },
                    "1": {
                      "text": "UNSEALED",
                      "color": "#0ca30c",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  }
                ]
              },
              "noValue": "not deployed"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 65,
          "title": "Game fleet DNS",
          "description": "play.terasology.org is a single A record pointed at one node's external IP, and every hosted game server sits behind it — they are distinguished only by port. So the address ceasing to be a node address takes the whole fleet offline by name at once, which is why this is one tile here rather than a panel on each game's dashboard. Reads the ALERT rather than re-testing the address, so this tile and the page cannot disagree. The rule lives in the tafl component (kustomize/fleet/published-ip.yaml). DRIFT does not mean the servers are down — under externalTrafficPolicy: Cluster any node address serves the NodePorts, so the fix is repointing DNS, not touching a game.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertname=\"GameFleetPublishedIPDrift\", alertstate=\"firing\"}) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "DRIFT",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "id": 5,
          "title": "Platform components",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "bargauge",
          "id": 50,
          "title": "Uptime over range",
          "description": "Share of the selected range each component was ready. Uses the best replica, so a rolling restart is not counted as an outage.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time((max(kube_pod_status_ready{condition=\"true\", namespace=\"ingress-control\", pod=~\".*ingress-nginx-controller.*\"}))[$__range:1m]) * 100",
              "legendFormat": "ingress",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "avg_over_time((max(kube_pod_status_ready{condition=\"true\", namespace=\"jenkins\", pod=\"terajenkins-0\"}))[$__range:1m]) * 100",
              "legendFormat": "jenkins",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "avg_over_time((max(kube_pod_status_ready{condition=\"true\", namespace=\"argocd\", pod=~\"terargo-argocd-repo-server.*\"}))[$__range:1m]) * 100",
              "legendFormat": "argo repo",
              "instant": true
            },
            {
              "refId": "D",
              "expr": "avg_over_time((max(kube_pod_status_ready{condition=\"true\", namespace=\"argocd\", pod=~\"terargo-argocd-server-.*\"}))[$__range:1m]) * 100",
              "legendFormat": "argo server",
              "instant": true
            },
            {
              "refId": "E",
              "expr": "avg_over_time((max(kube_pod_status_ready{condition=\"true\", namespace=\"artifactory\", pod=\"terartifactory-artifactory-0\"}))[$__range:1m]) * 100",
              "legendFormat": "artifactory",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 95
                  },
                  {
                    "color": "#0ca30c",
                    "value": 99.5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 51,
          "title": "Readiness",
          "description": "1 = ready, 0 = not. Dips are the blips. A component flat at 1 while its probe reports down means the failure is between them, not in the pod.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kube_pod_status_ready{condition=\"true\", namespace=\"ingress-control\", pod=~\".*ingress-nginx-controller.*\"})",
              "legendFormat": "ingress"
            },
            {
              "refId": "B",
              "expr": "max(kube_pod_status_ready{condition=\"true\", namespace=\"jenkins\", pod=\"terajenkins-0\"})",
              "legendFormat": "jenkins"
            },
            {
              "refId": "C",
              "expr": "max(kube_pod_status_ready{condition=\"true\", namespace=\"argocd\", pod=~\"terargo-argocd-repo-server.*\"})",
              "legendFormat": "argo repo"
            },
            {
              "refId": "D",
              "expr": "max(kube_pod_status_ready{condition=\"true\", namespace=\"argocd\", pod=~\"terargo-argocd-server-.*\"})",
              "legendFormat": "argo server"
            },
            {
              "refId": "E",
              "expr": "max(kube_pod_status_ready{condition=\"true\", namespace=\"artifactory\", pod=\"terartifactory-artifactory-0\"})",
              "legendFormat": "artifactory"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "axisLabel": "ready"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3987e5",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "ingress"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "jenkins"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "argo repo"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "argo server"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "artifactory"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "id": 2,
          "title": "Cluster capacity — requested vs used",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "barchart",
          "id": 20,
          "title": "CPU per node — requested vs used",
          "description": "CPU requested vs actually used, per node. The gap is capacity the scheduler treats as spoken for.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\", node!=\"\"}), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "label_replace(sum by (node) (rate(container_cpu_usage_seconds_total{container!=\"\", node!=\"\"}[5m])), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "label_replace(sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "node",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true
                },
                "renameByName": {
                  "Value #A": "Requested",
                  "Value #B": "Used",
                  "Value #C": "Allocatable"
                }
              }
            }
          ],
          "options": {
            "orientation": "auto",
            "xTickLabelRotation": 0,
            "showValue": "auto",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 90,
                "axisLabel": "CPU cores"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3987e5",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Requested"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Allocatable"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#898781"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 15
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "barchart",
          "id": 21,
          "title": "Memory per node — requested vs used",
          "description": "Memory requested vs actually used, per node. Unlike CPU, an under-set memory request ends in OOMKilled.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(sum by (node) (kube_pod_container_resource_requests{resource=\"memory\", node!=\"\"}), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "label_replace(sum by (node) (container_memory_working_set_bytes{container!=\"\", node!=\"\"}), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "label_replace(sum by (node) (kube_node_status_allocatable{resource=\"memory\"}), \"node\", \"$1\", \"node\", \".*-(\\\\w+)$\")",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "node",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true
                },
                "renameByName": {
                  "Value #A": "Requested",
                  "Value #B": "Used",
                  "Value #C": "Allocatable"
                }
              }
            }
          ],
          "options": {
            "orientation": "auto",
            "xTickLabelRotation": 0,
            "showValue": "auto",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 90,
                "axisLabel": "memory"
              },
