apiVersion: heimdall.siliconsaga.org/v1alpha1
kind: HeimdallStack
metadata:
  name: heimdall
  namespace: heimdall
spec:
  parameters:
    # environment and domain are sourced from EnvironmentConfig/cluster-identity
    # by the composition pipeline. Set them here only to override the cluster
    # default for this specific claim.
    thanosEnabled: false
    # OPTS IN to probing the externally watched estate — Artifactory, Jenkins
    # and ArgoCD. This cluster can reach those hosts, so it watches them.
    #
    # Omit or clear this on any cluster that cannot: the probes would fail
    # continuously and report all three down at the watched tier, which is the
    # loudest thing Heimdall sends. The XRD defaults it to empty for that
    # reason, so opting in is always a deliberate act by a claim.
    watchedDomain: terasology.io
    # Reduced from 15d → 7d as a stopgap until the S3/Garage backend lands;
    # tracks the 2026-05-15 Prometheus crashloop incident response. See
    # docs/plans/2026-05-19-heimdall-monitoring-design.md.
    retentionDays: 7
    storageSize: "20Gi"
    lokiStorageSize: "5Gi"
    tempoStorageSize: "5Gi"
