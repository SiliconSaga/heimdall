# Heimdall Backups dashboard.
#
# One page answering "is anything actually being backed up, and where is storage
# going". It exists because Velero ran on GKE for a long time reporting healthy
# while storing nothing — an install that looks present is harder to notice than
# one that is missing, and no dashboard showed the difference.
#
# Delivered as a plain ConfigMap for the same reason as overview-dashboard.yaml:
# the Grafana sidecar watches `grafana_dashboard: "1"` cluster-wide, so this needs
# no Crossplane composition parameter and no rendering step.
#
# EVERY query here uses a metric that was verified to exist rather than assumed:
#   velero_backup_last_successful_timestamp{schedule}  gauge, unix seconds
#   velero_backup_failure_total{schedule}              counter
#   velero_backup_partial_failure_total{schedule}      counter
#   velero_backup_success_total{schedule}              counter
#   velero_backup_duration_seconds                     histogram
#   velero_backup_items_total{schedule}                gauge
#   velero_backup_tarball_size_bytes{schedule}         gauge, bytes
#   velero_backup_location_status_gauge{backup_location_name}  gauge, 1 = Available
#   velero_volume_snapshot_success_total{schedule}     counter
#   velero_volume_snapshot_failure_total{schedule}     counter
#   kubelet_volume_stats_used_bytes / _capacity_bytes  in-cluster PVs
#
# ⚠ EVERY velero_* query here filters schedule!="" — keep that on any new one,
# with the single documented exception noted below. Velero emits each of these
# metrics TWICE: once per Schedule, and once with schedule="" covering ad-hoc
# backups made by hand. The empty-label series is not a duplicate, it is a
# different thing that behaves badly here:
#   * last_successful_timestamp is a process-lifetime gauge that Velero never
#     clears, so it outlives the backup it describes and ages forever;
#   * nothing refreshes it unless someone runs another manual backup.
# Observed 2026-09-04: an expired, deleted verification backup still read 2.00
# days old and rendered as a red tile captioned with the entire label set —
# Grafana's fallback when {{schedule}} resolves to an empty string. The counters
# behaved less dramatically but doubled the series on the outcomes panel with
# permanently-flat lines.
#
# THE EXCEPTION: velero_backup_location_status_gauge carries no schedule label at
# all — it is per BackupStorageLocation (backup_location_name), not per backup.
# Filtering schedule!="" on it returns nothing. Verified 2026-09-15.
#
# ── What "off-site" actually means here, because the split is not obvious ──
# A Velero backup lands in TWO different places, and only one of them is the
# bucket:
#   * the GCS tarball holds Kubernetes OBJECT MANIFESTS. Measured 2026-09-15 at
#     4.9 MB for velero-daily-full. That number is small because it is not your
#     data.
#   * the PV data goes to GCE persistent-disk snapshots (NativeSnapshot), which
#     live in the GCP project and never enter the bucket. 70 volume snapshots
#     against that same schedule.
# Both are off-cluster, so both survive losing the cluster — but anyone reading
# "4.9 MB in the bucket" as "my databases are in the bucket" is wrong, and the
# off-site row is captioned to prevent exactly that reading.
#
# Still deliberately NOT here: total object-storage BUCKET size. Velero exposes
# no such metric — tarball_size_bytes above is per backup, not a bucket total —
# and GCS bucket bytes live in Cloud Monitoring
# (storage.googleapis.com/storage/v2/total_bytes), which nothing on this cluster
# scrapes. Inventing a metric name would ship a panel that renders "No data"
# forever — the same class of defect as the alert that queried a Caddy metric
# which never existed. See the follow-up in nordri/docs/velero-gke.md.
#
# Also deliberately NOT here: the shared MySQL cluster's engine-level backup.
# Not an oversight, and worth stating because its absence is itself the finding:
# NOTHING on this cluster exports a percona/pxc backup metric. Verified
# 2026-09-15 — `velero_*` matched 31 series, `.*percona.*`, `.*pxc.*` and
# `kube_customresource.*` each matched ZERO. The MySQL xtrabackup is
# `type: filesystem` (a local PVC, no off-site copy at all), so it belongs in the
# off-site row and cannot be put there honestly yet. Surfacing it needs
# kube-state-metrics CustomResourceState config for PerconaXtraDBClusterBackup
# first; until then this dashboard going green says nothing about MySQL, and the
# off-site row's caption says so out loud.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heimdall-backups-dashboard
  namespace: heimdall
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: heimdall
    app.kubernetes.io/component: dashboard
data:
  heimdall-backups.json: |
    {
      "uid": "heimdall-backups",
      "title": "Heimdall Backups",
      "description": "Velero backup health, what actually leaves the cluster, and in-cluster volume growth. Bucket-TOTAL size is absent on purpose — no exporter provides GCS object-storage metrics here. The shared MySQL engine backup is also absent: nothing exports a percona/pxc metric on this cluster, so a green page says nothing about MySQL.",
      "tags": [
        "heimdall",
        "backups"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Velero",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Time since last successful backup",
          "description": "Reads velero_backup_last_successful_timestamp, not velero_backup_last_status — upstream velero#6809 has last_status reporting failure for backups that actually succeeded. An empty tile is NOT healthy: the metric does not exist until a backup has succeeded once, which is exactly the state VeleroNoBackupsEverSucceeded alerts on. Instant query, because a stat tile means 'right now' — a range query would reduce a window and draw a value from before the thing you just changed. Filtered to schedule!=\"\": ad-hoc backups carry an empty schedule label, and that series is a process-lifetime gauge nothing ever refreshes, so it ages forever and shows up as a permanently-red tile labelled with the whole metric's label set (Grafana's fallback when {{schedule}} renders empty). NOTE this covers Velero only — it says nothing about the MySQL engine backup, which exports no metrics at all.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - velero_backup_last_successful_timestamp{schedule!=\"\"}",
              "legendFormat": "{{schedule}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 90000 },
                  { "color": "red", "value": 129600 }
                ]
              },
              "noValue": "NEVER — no successful backup on record"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "timeseries",
          "id": 3,
          "title": "Backup outcomes per day",
          "description": "Successes, failures and partial failures. A partial failure still completes and still refreshes the staleness clock, so it is easy to miss — it is charted separately for that reason. Filtered to schedule!=\"\": every one of these counters also exists with an empty schedule label for ad-hoc backups, which doubled the series count with three permanently-flat lines and made the panel look far busier than it was.",
          "gridPos": { "h": 6, "w": 10, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(velero_backup_success_total{schedule!=\"\"}[1d])",
              "legendFormat": "success — {{schedule}}"
            },
            {
              "refId": "B",
              "expr": "increase(velero_backup_failure_total{schedule!=\"\"}[1d])",
              "legendFormat": "failure — {{schedule}}"
            },
            {
              "refId": "C",
              "expr": "increase(velero_backup_partial_failure_total{schedule!=\"\"}[1d])",
              "legendFormat": "partial — {{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } }
            }
          }
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "Backup duration",
          "description": "Rising duration on a roughly constant cluster is the early signal that a backup is on its way to timing out.",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, schedule) (rate(velero_backup_duration_seconds_bucket{schedule!=\"\"}[1d])))",
              "legendFormat": "p95 — {{schedule}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Items backed up",
          "description": "A sharp drop without a matching drop in cluster size means the backup silently stopped covering something.",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_items_total{schedule!=\"\"}",
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "row",
          "id": 20,
          "title": "Off-site — what actually left the cluster (and what is not covered)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 }
        },
        {
          "type": "stat",
          "id": 21,
          "title": "Off-site target available",
          "description": "velero_backup_location_status_gauge for the BackupStorageLocation: 1 = Available, 0 = Unavailable. This is the panel that would have caught the original incident — Velero reporting healthy while its storage target was not actually usable. THE ONE QUERY ON THIS PAGE WITH NO schedule!=\"\" FILTER, and deliberately so: this metric is per BackupStorageLocation and carries no schedule label at all, so filtering it returns nothing. Available only means the bucket is reachable and Velero can write it — it does not mean a recent backup succeeded. Read it beside the staleness tile above, never instead of it.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_location_status_gauge",
              "legendFormat": "{{backup_location_name}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "UNAVAILABLE", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "Available", "color": "green", "index": 1 } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "noValue": "NO STORAGE LOCATION REPORTING"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "timeseries",
          "id": 22,
          "title": "Bytes written to the GCS bucket (object manifests — NOT your data)",
          "description": "velero_backup_tarball_size_bytes: the size of the Kubernetes OBJECT tarball Velero uploads. Measured 2026-09-15 at 4.9 MB, and that is the expected order of magnitude — it holds manifests, not volumes. If you are looking for where the databases went, it is the panel to the right: PV contents go to GCE persistent-disk snapshots, which never enter this bucket. A tarball that suddenly collapses toward zero means the backup stopped covering objects; a tarball in the gigabytes would mean something is writing volume data into it that should not be.",
          "gridPos": { "h": 5, "w": 9, "x": 6, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_tarball_size_bytes{schedule!=\"\"}",
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "id": 23,
          "title": "Volume snapshots per day (where the data actually goes)",
          "description": "GCE persistent-disk snapshots taken per backup run — this is the off-site copy of real volume data, including the shared MySQL datadir and the Postgres PVCs. Charted as daily increase to match the outcomes panel above. Any non-zero failure line means a volume did NOT leave the cluster even though the backup as a whole may still have reported success, which is precisely the state that looks fine and is not. ⚠ These snapshots are CRASH-consistent, not transaction-consistent — a disaster-recovery net, not a substitute for an engine-level backup.",
          "gridPos": { "h": 5, "w": 9, "x": 15, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(velero_volume_snapshot_success_total{schedule!=\"\"}[1d])",
              "legendFormat": "snapshotted — {{schedule}}"
            },
            {
              "refId": "B",
              "expr": "increase(velero_volume_snapshot_failure_total{schedule!=\"\"}[1d])",
              "legendFormat": "FAILED — {{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } }
            }
          }
        },
        {
          "type": "row",
          "id": 30,
          "title": "Engine-level backups (what Velero's disk snapshot does not give you)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "type": "stat",
          "id": 31,
          "title": "Time since last OpenBao Raft snapshot",
          "description": "kube_cronjob_status_last_successful_time for the OpenBao Helm chart's snapshot agent (CronJob openbao/openbao-snapshot), which uploads a Raft snapshot to a dedicated bucket daily at 05:00 UTC. Same reading as the Velero tile above: an empty tile is NOT healthy — kube-state-metrics emits this series only after the CronJob has succeeded once, which is the state OpenBaoSnapshotNeverSucceeded alerts on. Instant query for the same reason as the Velero tile. Thresholds match the Velero tile: yellow past one missed run, red past 36h (OpenBaoSnapshotStale). The disk snapshot Velero takes of the openbao PVC is crash-consistent and needs the seal to open; this snapshot is the vault's own export, restorable with bao operator raft snapshot restore — nidavellir docs/secrets-management.md.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - kube_cronjob_status_last_successful_time{namespace=\"openbao\", cronjob=\"openbao-snapshot\"}",
              "legendFormat": "{{cronjob}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 90000 },
                  { "color": "red", "value": 129600 }
                ]
              },
              "noValue": "NEVER — no OpenBao snapshot on record"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "row",
          "id": 10,
          "title": "In-cluster volume growth (what a snapshot has to copy)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "Used bytes per PVC",
          "description": "Persistent-disk snapshots are incremental, so the cost driver is total provisioned data and its rate of change rather than the snapshot count. This is the closest available proxy for where a storage bill would come from, until an exporter provides real bucket metrics.",
          "gridPos": { "h": 5, "w": 16, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes))",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "stat",
          "id": 12,
          "title": "Total provisioned / used",
          "description": "Capacity is what GCP bills for on a persistent disk; used is what a snapshot actually copies. A large gap means money spent on empty space.",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kubelet_volume_stats_capacity_bytes)",
              "legendFormat": "provisioned",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum(kubelet_volume_stats_used_bytes)",
              "legendFormat": "used",
              "instant": true
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none"
          }
        }
      ]
    }
