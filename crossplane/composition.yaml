apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xheimdallstack-lgtm
  labels:
    provider: grafana-lgtm
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: heimdall.siliconsaga.org/v1alpha1
    kind: XHeimdallStack
  pipeline:

  # ──────────────────────────────────────────────────────────
  # Step 0: Load cluster identity (environment, storageClass, domain)
  # Crossplane v2 requires a function call to populate the pipeline context;
  # the older `spec.environment.environmentConfigs` Composition field is gone.
  # Downstream templates read overrides from spec.parameters first, then fall
  # back to the EnvironmentConfig values via Sprig's `default`.
  # ──────────────────────────────────────────────────────────
  - step: load-cluster-identity
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: cluster-identity

  # ──────────────────────────────────────────────────────────
  # Step 1: kube-prometheus-stack (Prometheus + Grafana + AlertManager)
  # ──────────────────────────────────────────────────────────
  - step: deploy-kube-prometheus-stack
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $env := .observed.composite.resource.spec.parameters.environment | default $identity.environment -}}
          {{- $storageClass := $identity.storageClass -}}
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-kube-prometheus
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: kube-prometheus-stack
          spec:
            forProvider:
              chart:
                name: kube-prometheus-stack
                repository: https://prometheus-community.github.io/helm-charts
                version: "82.16.0"
              namespace: heimdall
              values:
                # ── Alert hygiene ──────────────────────────────────────────
                # These four control-plane components are not scrape-exposed on
                # EITHER environment: GKE hides the managed control plane, and
                # rancher-desktop k3s does not expose them either. Their default
                # rules therefore fire permanently at severity: critical, which
                # the ntfy template renders as priority 5 — the DND-piercing
                # tier — on a 1h repeat. That noise is why the phone app was
                # muted, which in turn is why a real 14h Artifactory outage on
                # 2026-07-27 went unseen. Disabling at chart level removes the
                # ServiceMonitor and the PrometheusRule together; an inhibit
                # rule would leave both still evaluating and still visible.
                kubeControllerManager:
                  enabled: false
                kubeScheduler:
                  enabled: false
                kubeProxy:
                  enabled: false
                kubeEtcd:
                  enabled: false
                # CoreDNS genuinely differs between the two environments, so
                # this one is conditional rather than off: k3s runs real CoreDNS
                # exposing metrics on :9153, while GKE runs kube-dns, which does
                # not. On GKE the target can never come up, producing permanent
                # TargetDown warnings.
                coreDns:
                  enabled: {{ ne $env "gke" }}
                # ── Keep the observability stack itself off BestEffort ─────
                # These three ship with no resource requests, so they are
                # BestEffort and get whatever CPU is left over. On a contended
                # node that is not enough to answer their own liveness probes:
                # kube-state-metrics reached 196 restarts and node-exporter 929,
                # both killed by "context deadline exceeded" on /livez, with
                # Prometheus abandoning scrapes mid-flight ("write: broken pipe").
                #
                # kube-state-metrics matters most — it backs every Kube* alert
                # rule and most of the Overview dashboard, so when it is being
                # restarted the monitoring goes quietly blind rather than
                # reporting a problem.
                #
                # node-exporter is a DaemonSet, so its request applies per node
                # and a Pending DaemonSet pod cannot trigger a cluster scale-up.
                # Kept deliberately small for that reason.
                kube-state-metrics:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                prometheus-node-exporter:
                  resources:
                    requests:
                      # 10m, not the 20m first tried: a DaemonSet pod cannot
                      # trigger a cluster scale-up, so any node too full to fit
                      # the request simply loses node metrics for good. The
                      # tightest node had 12m free and stranded a pod.
                      #
                      # Even 10m matters — it is the difference between
                      # BestEffort and Burstable, which is what decides CFS
                      # share and eviction order. Raise it once the idle
                      # reservations on the packed nodes are freed.
                      cpu: 10m
                      memory: 32Mi
                prometheusOperator:
                  resources:
                    requests:
                      cpu: 25m
                      memory: 96Mi
                prometheus:
                  prometheusSpec:
                    {{- if eq $env "gke" }}
                    replicas: 2
                    {{- else }}
                    replicas: 1
                    {{- end }}
                    retention: {{ .observed.composite.resource.spec.parameters.retentionDays | default 7 }}d
                    storageSpec:
                      volumeClaimTemplate:
                        spec:
                          storageClassName: {{ $storageClass }}
                          accessModes: ["ReadWriteOnce"]
                          resources:
                            requests:
                              storage: {{ .observed.composite.resource.spec.parameters.storageSize | default "10Gi" }}
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: "1"
                        memory: 2Gi
                    # Discover ServiceMonitors/PodMonitors cluster-wide regardless of the
                    # `release` label. The chart default (…NilUsesHelmValues: true) scopes
                    # discovery to `release: <name>-kube-prometheus`, but this Prometheus's
                    # release name is composite-suffixed (heimdall-<xrsuffix>-kube-prometheus),
                    # random per cluster — so app ServiceMonitors (e.g. kubicvalheim) can't
                    # know it at author time. A platform Prometheus watches everything given.
                    serviceMonitorSelectorNilUsesHelmValues: false
                    podMonitorSelectorNilUsesHelmValues: false
                    # Probes need the same cluster-wide discovery for the same
                    # reason, and were missed when #11 fixed the other two.
                    # Left at the default, probeSelector pins to
                    # `release: heimdall-<xrsuffix>-kube-prometheus` — a suffix
                    # that is random per cluster and therefore unknowable to a
                    # Probe authored in another repo. Caught by testing on the
                    # local cluster: serviceMonitorSelector rendered {} while
                    # probeSelector still carried the matchLabels pin.
                    probeSelectorNilUsesHelmValues: false
                    # Rules need the same cluster-wide discovery, and are the last
                    # of the four still at the chart default. An app PrometheusRule
                    # (e.g. kubicvalheim's ValheimDown) cannot carry
                    # `release: heimdall-<xrsuffix>-kube-prometheus` because that
                    # suffix is random per cluster — the identical argument already
                    # made above for ServiceMonitors and Probes. Heimdall's own
                    # self-health rules are unaffected: they carry the label, and an
                    # empty selector is a superset.
                    ruleSelectorNilUsesHelmValues: false
                grafana:
                  enabled: true
                  adminPassword: admin
                  sidecar:
                    datasources:
                      enabled: true
                  additionalDataSources:
                  - name: Loki
                    type: loki
                    url: http://{{ .observed.composite.resource.metadata.name }}-loki.heimdall.svc:3100
                    access: proxy
                    jsonData:
                      derivedFields:
                      - datasourceUid: tempo
                        matcherRegex: "traceID=(\\w+)"
                        name: TraceID
                        url: "$${__value.raw}"
                  - name: Tempo
                    type: tempo
                    uid: tempo
                    url: http://{{ .observed.composite.resource.metadata.name }}-tempo.heimdall.svc:3200
                    access: proxy
                    jsonData:
                      tracesToLogs:
                        datasourceUid: loki
                        filterByTraceID: true
                      serviceMap:
                        datasourceUid: prometheus
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
                alertmanager:
                  alertmanagerSpec:
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 250m
                        memory: 256Mi
                  config:
                    # Alerts fan out to THREE ntfy topics, not one. A single topic
                    # collapses on Android into "N notifications" with no way to
                    # treat a down service differently from routine node chatter;
                    # separate topics get their own notification group AND their
                    # own per-topic sound/DND settings in the app, which is the
                    # only lever that survives the phone overriding the server.
                    #
                    # Tiers, deliberately narrow at the top:
                    #   2  heimdall-info     cluster chatter — capacity, saturation
                    #   3  heimdall-workload something should be running and isn't
                    #   4  heimdall-watched  a named service we explicitly watch
                    #   5  (unused)          reserved for on-call; nothing earns it yet
                    #
                    # 5 is the only priority that pierces Do Not Disturb, so it stays
                    # empty until the alerts have earned enough trust to wake someone.
                    route:
                      group_by: ['alertname', 'namespace']
                      group_wait: 30s
                      group_interval: 5m
                      repeat_interval: 4h
                      receiver: 'null'
                      routes:
                        # Tier 4 — services carrying watched="true" on the series.
                        # First match wins, so this outranks severity entirely: a
                        # watched service being down is the loudest thing we send.
                        - matchers: ['watched = "true"']
                          receiver: ntfy-watched
                          repeat_interval: 1h
                        # Tier 3 — workload health. These are the kube-prometheus
                        # alerts that mean "something should be running and isn't",
                        # which is a different question from "the cluster is busy".
                        - matchers: ['alertname =~ "KubePod.*|KubeContainerWaiting|KubeDeployment.*|KubeStatefulSet.*|KubeDaemonSet.*|KubeJob.*|KubeHpa.*"']
                          receiver: ntfy-workload
                        # Tier 2 — everything else that still warrants a look.
                        # info/none severities keep falling through to 'null'
                        # (Watchdog, InfoInhibitor) so they never reach the phone.
                        - matchers: ['severity =~ "warning|critical"']
                          receiver: ntfy-info
                    receivers:
                      # blackhole for anything below warning; quotes are
                      # load-bearing — bare null parses as YAML nil and the
                      # route's receiver ref would no longer match.
                      - name: 'null'
                      - name: ntfy-info
                        webhook_configs:
                          - url: "http://ntfy.ntfy.svc.cluster.local/heimdall-info?template=heimdall-info"
                            send_resolved: true
                      - name: ntfy-workload
                        webhook_configs:
                          - url: "http://ntfy.ntfy.svc.cluster.local/heimdall-workload?template=heimdall-workload"
                            send_resolved: true
                      - name: ntfy-watched
                        webhook_configs:
                          - url: "http://ntfy.ntfy.svc.cluster.local/heimdall-watched?template=heimdall-watched"
                            send_resolved: true
                          {{- if .observed.composite.resource.spec.parameters.knarrWebhookUrl }}
                          - url: "{{ .observed.composite.resource.spec.parameters.knarrWebhookUrl }}"
                            send_resolved: true
                          {{- end }}

  # ──────────────────────────────────────────────────────────
  # Step 2: Loki (Log Aggregation)
  # ──────────────────────────────────────────────────────────
  - step: deploy-loki
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $storageClass := $identity.storageClass -}}
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-loki
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: loki
          spec:
            forProvider:
              chart:
                name: loki
                repository: https://grafana.github.io/helm-charts
                version: "6.55.0"
              namespace: heimdall
              values:
                deploymentMode: SingleBinary
                loki:
                  auth_enabled: false
                  commonConfig:
                    replication_factor: 1
                  schemaConfig:
                    configs:
                    - from: "2024-04-01"
                      store: tsdb
                      object_store: filesystem
                      schema: v13
                      index:
                        prefix: index_
                        period: 24h
                  storage:
                    type: filesystem
                  limits_config:
                    retention_period: {{ .observed.composite.resource.spec.parameters.retentionDays | default 7 }}d
                  compactor:
                    retention_enabled: true
                    delete_request_store: filesystem
                singleBinary:
                  replicas: 1
                  persistence:
                    enabled: true
                    storageClass: {{ $storageClass }}
                    size: {{ .observed.composite.resource.spec.parameters.lokiStorageSize | default "5Gi" }}
                  resources:
                    requests:
                      cpu: 250m
                      memory: 256Mi
                    limits:
                      cpu: "1"
                      memory: 1Gi
                # Disable components not needed in SingleBinary mode
                read:
                  replicas: 0
                write:
                  replicas: 0
                backend:
                  replicas: 0
                gateway:
                  enabled: false
                chunksCache:
                  enabled: false
                resultsCache:
                  enabled: false

  # ──────────────────────────────────────────────────────────
  # Step 3: Tempo (Distributed Tracing)
  # ──────────────────────────────────────────────────────────
  - step: deploy-tempo
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $storageClass := $identity.storageClass -}}
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-tempo
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: tempo
          spec:
            forProvider:
              chart:
                name: tempo
                repository: https://grafana.github.io/helm-charts
                version: "1.24.4"
              namespace: heimdall
              values:
                tempo:
                  retention: {{ mul (.observed.composite.resource.spec.parameters.retentionDays | default 7) 24 }}h
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: "0.0.0.0:4317"
                        http:
                          endpoint: "0.0.0.0:4318"
                  storage:
                    trace:
                      backend: local
                      local:
                        path: /var/tempo/traces
                persistence:
                  enabled: true
                  storageClassName: {{ $storageClass }}
                  size: {{ .observed.composite.resource.spec.parameters.tempoStorageSize | default "5Gi" }}
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi

  # ──────────────────────────────────────────────────────────
  # Step 3.4: OpenTelemetry Collector (log-shipper DaemonSet)
  #
  # Closes the heimdall log-collector gap. Runs one collector per node
  # (DaemonSet) tailing /var/log/pods via the filelog receiver (wired by
  # the logsCollection preset), enriches each record with pod/namespace/
  # node metadata via the k8sattributes processor (wired by the
  # kubernetesAttributes preset, which also creates the ClusterRole +
  # ServiceAccount it needs), and ships to Loki's native OTLP ingest.
  #
  # Distro: image otel/opentelemetry-collector-k8s is the curated
  # Kubernetes distribution that bundles filelog + k8sattributes; the
  # core otel/opentelemetry-collector image does not include
  # k8sattributes, so the k8s distro is required.
  #
  # Loki sink: auth_enabled is false and there is no gateway in front of
  # the SingleBinary Loki, so no X-Scope-OrgID header is required. The
  # otlphttp exporter appends /v1/logs to the endpoint, hitting Loki's
  # /otlp/v1/logs. The chart deep-merges this config: block onto the
  # preset-injected logs pipeline, so filelog/k8sattributes survive.
  #
  # Placed after deploy-loki (sink must exist) and before auto-ready
  # (which must remain the final step).
  #
  # Scope: this DaemonSet tails EVERY namespace's pod stdout cluster-wide —
  # that breadth is the point (it closes the platform-wide log-collector gap),
  # and the sink is the private in-cluster Loki (no external egress). Logs may
  # therefore carry secrets/PII that apps write to stdout; treat Loki access
  # accordingly. A per-namespace filelog exclude or a redaction/filter
  # processor is the future enhancement if a namespace must be withheld.
  # ──────────────────────────────────────────────────────────
  - step: deploy-otel-collector
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-otel-collector
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: otel-collector
          spec:
            forProvider:
              chart:
                name: opentelemetry-collector
                repository: https://open-telemetry.github.io/opentelemetry-helm-charts
                version: "0.159.0"
              namespace: heimdall
              values:
                mode: daemonset
                image:
                  repository: otel/opentelemetry-collector-k8s
                presets:
                  logsCollection:
                    enabled: true
                  kubernetesAttributes:
                    enabled: true
                config:
                  exporters:
                    otlphttp/loki:
                      endpoint: http://{{ .observed.composite.resource.metadata.name }}-loki.heimdall.svc.cluster.local:3100/otlp
                  service:
                    pipelines:
                      logs:
                        exporters:
                          - otlphttp/loki
                resources:
                  requests:
                    cpu: 50m
                    memory: 256Mi
                  limits:
                    cpu: 250m
                    # Headroom for the filelog receiver's buffers + the
                    # k8sattributes metadata cache under real cluster log
                    # volume; 256Mi risked OOMKill (silent log-shipping gaps).
                    memory: 512Mi

  # ──────────────────────────────────────────────────────────
  # Step 3.5: Self-health PrometheusRules
  #
  # Heimdall-scoped alerts that would have caught the 2026-05-15 GKE
  # crashloop (4d18h, 1328 + 275 restarts, full WAL) before users noticed.
  # The chart's default rules cover this in the general case
  # (KubePersistentVolumeFillingUp etc.) but fire across the whole cluster;
  # these are namespace-pinned with heimdall-specific labels for clean
  # routing once AlertManager notifications land in a follow-up arc.
  #
  # `ruleSelectorNilUsesHelmValues` is set explicitly false above, which
  # renders `ruleSelector` as an empty selector — matching every
  # PrometheusRule cluster-wide, these included. The `release:
  # <name>-kube-prometheus` label is kept here to document intent, but it is
  # no longer what makes the operator pick the rule up; an empty selector is
  # a superset of it.
  # ──────────────────────────────────────────────────────────
  - step: deploy-self-health-rules
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-self-health-rules
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: self-health-rules
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: PrometheusRule
                metadata:
                  name: heimdall-self-health
                  namespace: heimdall
                  labels:
                    release: {{ $name }}-kube-prometheus
                    app.kubernetes.io/part-of: heimdall
                    app.kubernetes.io/component: alert-rules
                spec:
                  groups:
                  - name: heimdall.pvc-fill
                    interval: 1m
                    rules:
                    - alert: HeimdallPVCFillingUp
                      expr: |
                        (kubelet_volume_stats_used_bytes{namespace="heimdall"}
                         / kubelet_volume_stats_capacity_bytes{namespace="heimdall"}) > 0.80
                      for: 15m
                      labels:
                        severity: warning
                        component: heimdall
                      annotations:
                        summary: {{ `Heimdall PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full` | quote }}
                        description: {{ `PVC {{ $labels.persistentvolumeclaim }} is over 80% full. Check retention settings or expand it.` | quote }}
                    - alert: HeimdallPVCCritical
                      expr: |
                        (kubelet_volume_stats_used_bytes{namespace="heimdall"}
                         / kubelet_volume_stats_capacity_bytes{namespace="heimdall"}) > 0.90
                      for: 5m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `Heimdall PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full — imminent out-of-space` | quote }}
                        description: {{ `PVC {{ $labels.persistentvolumeclaim }} is over 90% full. Expand it or reduce retentionDays.` | quote }}
                  # Data-service durability. The pvc-fill group above is scoped
                  # to namespace=heimdall, so database volumes in tenant
                  # namespaces had no fill alerting at all until this group.
                  #
                  # Scope differs per rule, deliberately. Fill applies to every
                  # volume, because running out of space is bad for anything.
                  # Shrink and age match PostgreSQL data volumes by name,
                  # because the semantics only hold there: Postgres does not
                  # free large amounts of space on its own, whereas Redis
                  # rewriting an RDB or Kafka expiring segments legitimately
                  # drops usage, and alerting on those would be noise. pgBackRest
                  # repos (*-repo1) are excluded from shrink for the same reason.
                  #
                  # No pg_* metrics exist on this cluster — there is no
                  # PostgreSQL exporter — so these infer database health from
                  # volume behaviour rather than reading it from the engine.
                  - name: heimdall.data-services
                    interval: 1m
                    rules:
                    - alert: HeimdallDatabaseVolumeShrank
                      expr: |
                        (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*pgdata|data-.*postgresql.*"}
                         / (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*pgdata|data-.*postgresql.*"} offset 1h)) < 0.5
                      for: 10m
                      labels:
                        severity: critical
                        component: data-services
                        # Routes to the watched tier deliberately. Severity alone
                        # lands in the silent topic, and data disappearing is the
                        # one thing that should not wait to be noticed.
                        watched: "true"
                      annotations:
                        summary: {{ `Database volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} lost more than half its data` | quote }}
                        description: {{ `Usage fell to {{ $value | humanizePercentage }} of an hour ago. Check the cluster before anything writes over it.` | quote }}
                    - alert: HeimdallDatabaseVolumeRecreated
                      expr: |
                        (time() - kube_persistentvolumeclaim_created{persistentvolumeclaim=~".*pgdata|data-.*postgresql.*"}) < 900
                      for: 2m
                      labels:
                        severity: warning
                        component: data-services
                      annotations:
                        summary: {{ `Database volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is new` | quote }}
                        description: {{ `A fresh volume means fresh data. Expected when provisioning, otherwise the old data is gone.` | quote }}
                    # Fill alerting covers EVERY volume outside heimdall rather
                    # than matching database name patterns.
                    #
                    # Review found the pattern silently excluded real data
                    # volumes — Valkey, Kafka, Chroma and OpenBao all store
                    # state and none match a postgres-shaped name. Enumerating
                    # engines would leave the next one uncovered the same way,
                    # and a volume running out of space is bad regardless of
                    # what is on it, so there is nothing to gain by narrowing.
                    # heimdall's own storage is excluded because the
                    # heimdall.pvc-fill group above already covers it at its own
                    # thresholds.
                    - alert: HeimdallVolumeFillingUp
                      expr: |
                        (kubelet_volume_stats_used_bytes{namespace!="heimdall"}
                         / kubelet_volume_stats_capacity_bytes{namespace!="heimdall"}) > 0.85
                      for: 15m
                      labels:
                        severity: warning
                        component: data-services
                      annotations:
                        summary: {{ `Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full` | quote }}
                        description: {{ `Expand it or reclaim space before it fills.` | quote }}
                    - alert: HeimdallVolumeCritical
                      expr: |
                        (kubelet_volume_stats_used_bytes{namespace!="heimdall"}
                         / kubelet_volume_stats_capacity_bytes{namespace!="heimdall"}) > 0.93
                      for: 5m
                      labels:
                        severity: critical
                        component: data-services
                        watched: "true"
                      annotations:
                        summary: {{ `Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full` | quote }}
                        description: {{ `A full volume stops writes and can need manual recovery. Expand it now.` | quote }}
                    - alert: HeimdallDatabaseBackupFailed
                      # Scoped to the last 24h. kube_job_status_failed stays >0
                      # for as long as the Job object exists, so an unscoped
                      # rule fires forever after one failure and has to be
                      # silenced — which is how a real second failure gets
                      # missed. A day is longer than the daily backup interval,
                      # so a still-failing schedule keeps re-firing on its own.
                      expr: |
                        kube_job_status_failed{job_name=~".*-backup-.*"} > 0
                        and on(namespace, job_name) (time() - kube_job_created) < 86400
                      for: 5m
                      labels:
                        severity: warning
                        component: data-services
                      annotations:
                        summary: {{ `Backup job {{ $labels.namespace }}/{{ $labels.job_name }} failed` | quote }}
                        description: {{ `A failed backup is only discovered during a restore unless it is alerted on.` | quote }}
                  - name: heimdall.prometheus-health
                    interval: 1m
                    rules:
                    - alert: HeimdallPrometheusRestartStorm
                      expr: |
                        changes(kube_pod_container_status_restarts_total{
                          namespace="heimdall",
                          container="prometheus"
                        }[15m]) > 3
                      for: 0m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `Prometheus pod {{ $labels.pod }} restarted more than 3 times in 15 minutes` | quote }}
                        description: {{ `Restarted {{ $value }} times in 15 minutes. Check pod logs for disk-full, WAL corruption, or OOMKilled.` | quote }}
                    - alert: HeimdallPrometheusWALCorruption
                      expr: increase(prometheus_tsdb_wal_corruptions_total{namespace="heimdall"}[10m]) > 0
                      for: 0m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `Prometheus TSDB WAL corruption detected on {{ $labels.instance }}` | quote }}
                        description: {{ `{{ $value }} WAL corruption events in 10 minutes. Data loss likely; check disk health.` | quote }}
                    - alert: HeimdallPrometheusTSDBCompactionFailures
                      expr: increase(prometheus_tsdb_compactions_failed_total{namespace="heimdall"}[1h]) > 0
                      for: 0m
                      labels:
                        severity: warning
                        component: heimdall
                      annotations:
                        summary: {{ `Prometheus TSDB compaction failures on {{ $labels.instance }}` | quote }}
                        description: {{ `{{ $value }} compaction failures in the last hour. Often precedes disk pressure.` | quote }}
                  # Black-box probe alerts, in two tiers.
                  #
                  # Probe discovery is cluster-wide, so ANY Probe anywhere would
                  # otherwise page at critical — the exact over-use of the tier
                  # this work exists to stop. Criticality is therefore opt-in via
                  # a `watched: "true"` label on the probe's staticConfig, which
                  # (unlike a CR metadata label) actually propagates onto the
                  # series. Unmarked probes still alert, at warning.
                  - name: heimdall.probes
                    interval: 30s
                    rules:
                    - alert: HeimdallWatchedServiceDown
                      expr: probe_success{watched="true"} == 0
                      for: 3m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `Watched service {{ $labels.instance }} is unreachable` | quote }}
                        description: {{ `{{ $labels.instance }} has failed its probe for 3 minutes.` | quote }}
                    - alert: HeimdallProbedServiceDown
                      expr: probe_success{watched!="true"} == 0
                      for: 3m
                      labels:
                        severity: warning
                        component: heimdall
                      annotations:
                        summary: {{ `Probed service {{ $labels.instance }} is unreachable` | quote }}
                        description: {{ `{{ $labels.instance }} has failed its probe for 3 minutes. Set watched=true on its staticConfig labels to raise it to critical.` | quote }}
                    # probe_success == 0 cannot fire if the series stops existing.
                    # These two cover that blind spot: the exporter being
                    # unscrapeable, or every probe series vanishing at once.
                    - alert: HeimdallProbeScrapeFailing
                      expr: up{job=~"probe/.+"} == 0
                      for: 5m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `Prometheus cannot scrape probe job {{ $labels.job }}` | quote }}
                        description: {{ `The blackbox exporter is unreachable, so probe alerts are blind. Check the heimdall-blackbox Service and the exporter pod.` | quote }}
                    - alert: HeimdallProbePipelineDown
                      # Scoped to Probe-generated jobs rather than bare
                      # absent(probe_success): any other exporter emitting a
                      # probe_success series would otherwise satisfy the check
                      # and mask a genuinely dead Probe pipeline.
                      expr: absent(probe_success{job=~"probe/.+"})
                      for: 5m
                      labels:
                        severity: critical
                        component: heimdall
                      annotations:
                        summary: {{ `No probe_success series exist at all` | quote }}
                        description: {{ `All probe series have disappeared. Service-reachability alerting is dead until this clears.` | quote }}
                    - alert: HeimdallWatchedServiceSlow
                      expr: probe_duration_seconds > 5
                      for: 10m
                      labels:
                        severity: warning
                        component: heimdall
                      annotations:
                        summary: {{ `Watched service {{ $labels.instance }} is responding slowly` | quote }}
                        description: {{ `Probe duration over 5s for 10 minutes ({{ $value }}s). Often precedes an outright failure.` | quote }}
                    - alert: HeimdallCertExpiringSoon
                      expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
                      for: 1h
                      labels:
                        severity: warning
                        component: heimdall
                      annotations:
                        summary: {{ `TLS certificate for {{ $labels.instance }} expires in under 14 days` | quote }}
                        description: {{ `Certificate renewal is not happening. Manual intervention needed before expiry.` | quote }}

  # ──────────────────────────────────────────────────────────
  # Step 3.6: Blackbox Exporter — black-box service probing
  #
  # Every other rule in this stack reasons about cluster internals. None of
  # them answers "is the URL a user actually visits responding?" That gap is
  # what let artifactory.terasology.io stay down for ~14h on 2026-07-27 while
  # KubePodCrashLooping fired correctly but only at severity: warning.
  #
  # Probing supplies the missing axis and, with it, a principled severity
  # rule: internal signals stay warning and inform diagnosis; a black-box
  # probe failure is what earns critical and the DND bypass.
  # ──────────────────────────────────────────────────────────
  - step: deploy-blackbox-exporter
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $domain := .observed.composite.resource.spec.parameters.domain | default $identity.domain -}}
          {{- /*
            Watched services sit on their own domain, NOT the platform's.
            Grafana is platform ingress and follows $domain; Artifactory,
            Jenkins and ArgoCD are pre-existing services that do not. Folding
            them into $domain would silently repoint every probe at a host
            that does not exist and report the services as down.
          */ -}}
          {{- $watchedDomain := .observed.composite.resource.spec.parameters.watchedDomain | default "terasology.io" -}}
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $name }}-blackbox
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: blackbox-exporter
          spec:
            forProvider:
              chart:
                name: prometheus-blackbox-exporter
                repository: https://prometheus-community.github.io/helm-charts
                version: "11.5.0"
              namespace: heimdall
              values:
                fullnameOverride: {{ $name }}-blackbox
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 128Mi
                # The chart's own ServiceMonitor is deliberately off: Probe CRs
                # are the intended entry point here, and the chart's monitor
                # would scrape the exporter's own metrics rather than run any
                # probe.
                serviceMonitor:
                  enabled: false
          ---
          # A FIXED-NAME alias Service in front of the exporter.
          #
          # Composition Helm releases are named from the composite
          # (heimdall-<xrsuffix>-…) and that suffix is random per cluster, so a
          # Probe authored in another repo cannot know the generated Service
          # name at author time. That is the same trap heimdall#11 hit with the
          # `release` label, and repeating it would defeat the point: a probe is
          # meant to be a file someone writes without consulting the cluster.
          # Every Probe targets heimdall-blackbox.heimdall.svc:9115, which is
          # identical on every cluster.
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-blackbox-alias-svc
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: blackbox-alias-svc
          spec:
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: heimdall-blackbox
                  namespace: heimdall
                  labels:
                    app.kubernetes.io/part-of: heimdall
                    app.kubernetes.io/component: blackbox-alias
                spec:
                  type: ClusterIP
                  ports:
                  - name: http
                    port: 9115
                    targetPort: http
                    protocol: TCP
                  selector:
                    app.kubernetes.io/name: prometheus-blackbox-exporter
                    app.kubernetes.io/instance: {{ $name }}-blackbox
          ---
          # First watched service. Probes the readiness endpoint rather than the
          # site root: the root serves a shell page early in Artifactory's boot,
          # so it would have reported healthy during part of the outage, while
          # /api/system/ping returns OK only once startup actually completes.
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-probe-artifactory
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: probe-artifactory
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: Probe
                metadata:
                  name: artifactory
                  namespace: heimdall
                  labels:
                    # Deliberately NO `release` label: with
                    # probeSelectorNilUsesHelmValues false above, discovery is
                    # cluster-wide, and this probe is meant to be the worked
                    # example that other repos copy. Requiring a label they
                    # cannot know would defeat the primitive.
                    #
                    # This CR-metadata label is descriptive only — it does NOT
                    # reach the metric. The `watched` label that drives alert
                    # severity lives in staticConfig.labels below.
                    heimdall.siliconsaga.org/watched: "true"
                spec:
                  prober:
                    url: heimdall-blackbox.heimdall.svc:9115
                  module: http_2xx
                  interval: 30s
                  targets:
                    staticConfig:
                      static:
                      - https://artifactory.{{ $watchedDomain }}/artifactory/api/system/ping
                      # staticConfig labels DO land on the resulting series,
                      # which is what makes severity selection possible.
                      labels:
                        watched: "true"
                        # Human-readable name for dashboards and alert text. The
                        # series is otherwise identified by its full probe URL,
                        # which is unreadable on a wall display. Optional: panels
                        # fall back to the Probe's own name when it is absent.
                        service: "Artifactory"
          ---
          # Jenkins. /login is the unauthenticated 200 — the site root redirects,
          # and anything deeper needs a session.
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-probe-jenkins
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: probe-jenkins
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: Probe
                metadata:
                  name: jenkins
                  namespace: heimdall
                  labels:
                    heimdall.siliconsaga.org/watched: "true"
                spec:
                  prober:
                    url: heimdall-blackbox.heimdall.svc:9115
                  module: http_2xx
                  interval: 30s
                  targets:
                    staticConfig:
                      static:
                      - https://jenkins.{{ $watchedDomain }}/login
                      labels:
                        watched: "true"
                        service: "Jenkins"
          ---
          # Legacy ArgoCD. /healthz is served unauthenticated.
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-probe-argocd
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: probe-argocd
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: Probe
                metadata:
                  name: argocd
                  namespace: heimdall
                  labels:
                    heimdall.siliconsaga.org/watched: "true"
                spec:
                  prober:
                    url: heimdall-blackbox.heimdall.svc:9115
                  module: http_2xx
                  interval: 30s
                  targets:
                    staticConfig:
                      static:
                      - https://argocd.{{ $watchedDomain }}/healthz
                      labels:
                        watched: "true"
                        service: "ArgoCD"
          ---
          # Grafana — the window onto everything else, so worth knowing when it
          # is the thing that is down.
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-probe-grafana
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: probe-grafana
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: Probe
                metadata:
                  name: grafana
                  namespace: heimdall
                  labels:
                    heimdall.siliconsaga.org/watched: "true"
                spec:
                  prober:
                    url: heimdall-blackbox.heimdall.svc:9115
                  module: http_2xx
                  interval: 30s
                  targets:
                    staticConfig:
                      static:
                      - https://grafana.{{ $domain }}/api/health
                      labels:
                        watched: "true"
                        service: "Grafana"

  # ──────────────────────────────────────────────────────────
  # Step 4: Ingress Routes (Traefik IngressRoute)
  # ──────────────────────────────────────────────────────────
  - step: deploy-ingress-routes
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $domain := .observed.composite.resource.spec.parameters.domain | default $identity.domain -}}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-grafana-ingress
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-ingress
          spec:
            forProvider:
              manifest:
                apiVersion: traefik.io/v1alpha1
                kind: IngressRoute
                metadata:
                  name: grafana
                  namespace: heimdall
                spec:
                  entryPoints:
                    - web
                    - websecure
                  routes:
                    - match: Host(`grafana.{{ $domain }}`)
                      kind: Rule
                      services:
                        - name: {{ .observed.composite.resource.metadata.name }}-kube-prometheus-grafana
                          port: 80
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-prometheus-ingress
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: prometheus-ingress
          spec:
            forProvider:
              manifest:
                apiVersion: traefik.io/v1alpha1
                kind: IngressRoute
                metadata:
                  name: prometheus
                  namespace: heimdall
                spec:
                  entryPoints:
                    - web
                  routes:
                    - match: Host(`prometheus.{{ $domain }}`)
                      kind: Rule
                      services:
                        - name: {{ .observed.composite.resource.metadata.name }}-kube-promet-prometheus
                          port: 9090

  # ──────────────────────────────────────────────────────────
  # Step 5: Auto-ready
  # ──────────────────────────────────────────────────────────
  - step: auto-ready
    functionRef:
      name: function-auto-ready
